<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LIMESTONE | Artifact Vault — Esthetic Digital Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0A0A0F;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-orb {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(20, 30, 70, 0.4), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(0, 200, 200, 0.15), transparent 60%);
            pointer-events: none;
            z-index: -2;
        }

        .noise-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* Login Container */
        .login-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
            background: rgba(5, 5, 15, 0.85);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel {
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(0, 255, 255, 0.1) inset;
            transform: translateY(0);
            animation: floatGlow 4s ease-in-out infinite;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translateY(0px); box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(0,255,255,0.1) inset; }
            50% { transform: translateY(-8px); box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,255,0.3) inset; }
        }

        .login-header h1 {
            font-size: 2.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFFFFF, #88FFFF, #2A9D8F);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .input-glow {
            background: rgba(5, 10, 25, 0.6);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            width: 100%;
            color: white;
            font-family: inherit;
            transition: 0.2s;
        }

        .input-glow:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 12px #0ff;
        }

        .login-btn {
            background: linear-gradient(95deg, #0F2B3D, #0A4C5C);
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px cyan;
            background: linear-gradient(95deg, #1A4A6A, #0F7B8C);
        }

        /* Dashboard */
        .dashboard {
            display: none;
            opacity: 0;
            transition: opacity 0.7s;
        }

        /* Glass Navigation */
        .nav-glass {
            position: sticky;
            top: 20px;
            margin: 20px 30px 0 30px;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
        }

        .logo-area {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #7FFFD4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logout-btn-neon {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid #ff7b72;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Layout 2 columns */
        .app-layout {
            display: flex;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            flex-wrap: wrap;
        }

        /* Sidebar premium */
        .premium-sidebar {
            flex: 1.2;
            min-width: 260px;
            background: rgba(12, 18, 32, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(0, 255, 255, 0.15);
            height: fit-content;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6c8db0;
            margin-bottom: 1rem;
        }

        .folder-tree {
            list-style: none;
            margin-top: 0.5rem;
        }

        .folder-node {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.8rem;
            margin: 0.3rem 0;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .folder-node.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid cyan;
            box-shadow: 0 2px 8px rgba(0,255,255,0.1);
        }

        .create-folder-input {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .create-folder-input input {
            background: #0a1022;
            border: 1px solid #2c4c6e;
            padding: 0.6rem;
            border-radius: 1rem;
            color: white;
            flex: 1;
        }

        /* Main Content */
        .main-content {
            flex: 3.5;
            min-width: 280px;
        }

        /* Form Card Premium */
        .card-premium {
            background: rgba(12, 18, 32, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid rgba(0, 255, 255, 0.15);
            margin-bottom: 2rem;
        }

        .grid-input {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .grid-input input, .grid-input select, .grid-input textarea {
            background: #0e1529;
            border: 1px solid #2c4c6e;
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
            color: white;
            font-family: inherit;
            flex: 1;
        }

        .btn-cyber {
            background: linear-gradient(120deg, #0f2b3d, #0b3b46);
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 2rem;
            font-weight: bold;
            color: #b5ffff;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Search & Filter Row */
        .search-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-box-modern {
            flex: 2;
            position: relative;
        }

        .search-box-modern i {
            position: absolute;
            left: 18px;
            top: 15px;
            color: #5f7f9f;
        }

        .search-box-modern input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background: #0e1529;
            border: 1px solid #2c4c6e;
            border-radius: 2rem;
            color: white;
        }

        /* Cards Grid */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.2rem;
        }

        .artifact-card {
            background: linear-gradient(145deg, rgba(15, 22, 40, 0.8), rgba(8, 12, 24, 0.9));
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .artifact-card:hover {
            transform: translateY(-5px);
            border-color: cyan;
            box-shadow: 0 10px 25px -8px rgba(0,255,255,0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .badge-type {
            font-size: 0.7rem;
            background: #0f4c5f;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
        }

        .delete-card {
            background: none;
            border: none;
            color: #ff8c7a;
            cursor: pointer;
            font-size: 1rem;
        }

        .folder-badge {
            font-size: 0.7rem;
            color: #7ab3c8;
            margin-top: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(0,0,0,0.3);
            border-radius: 2rem;
        }

        @media (max-width: 780px) {
            .app-layout { flex-direction: column; }
            .nav-glass { margin: 15px; }
        }
    </style>
</head>
<body>
<div class="bg-orb"></div>
<div class="noise-bg"></div>

<!-- LOGIN VIEW -->
<div id="loginWrapper" class="login-wrapper">
    <div class="glass-panel">
        <div class="login-header" style="text-align: center; margin-bottom: 2rem;">
            <h1>✦ LIMESTONE ✦</h1>
            <p style="color: #8cb3d9;">Artifact Vault · Simpan Esensi Digitalmu</p>
        </div>
        <div style="margin-bottom: 1rem;">
            <input type="text" id="loginUser" class="input-glow" placeholder="Username" autocomplete="off">
        </div>
        <div style="margin-bottom: 1.8rem;">
            <input type="password" id="loginPass" class="input-glow" placeholder="Password">
        </div>
        <button id="doLogin" class="login-btn"><i class="fas fa-gem"></i> Buka Vault</button>
        <div id="loginErrorMsg" style="color:#ff9980; font-size:0.8rem; text-align:center; margin-top:1rem; display:none;">✖ Kombinasi salah</div>
    </div>
</div>

<!-- DASHBOARD UTAMA -->
<div id="dashboardApp" class="dashboard">
    <div class="nav-glass">
        <div class="logo-area"><i class="fas fa-crown"></i> LIMESTONE · VAULT</div>
        <div class="logout-btn-neon" id="logoutBtnGlobal"><i class="fas fa-sign-out-alt"></i> Keluar</div>
    </div>

    <div class="app-layout">
        <!-- SIDEBAR FOLDER PREMIUM -->
        <div class="premium-sidebar">
            <div class="section-title"><i class="fas fa-folder-tree"></i> KOLEKSI FOLDER</div>
            <ul id="folderSidebarList" class="folder-tree">
                <li class="folder-node active" data-folder="Semua"><span><i class="fas fa-database"></i> Semua Item</span></li>
            </ul>
            <div class="create-folder-input">
                <input type="text" id="newFolderField" placeholder="Nama folder baru...">
                <button id="createFolderBtn" style="background:#0f2b3d; border:none; border-radius:1rem; padding:0 1rem; color:cyan;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- MAIN AREA -->
        <div class="main-content">
            <!-- Tambah Item Premium -->
            <div class="card-premium">
                <div class="grid-input">
                    <input type="text" id="itemTitleField" placeholder="Judul unik...">
                    <select id="itemTypeSelect">
                        <option value="teks">📄 Teks / Catatan</option>
                        <option value="tautan">🔗 Tautan Penting</option>
                        <option value="ide">💡 Ide / Inspirasi</option>
                    </select>
                </div>
                <div class="grid-input">
                    <textarea id="itemValueField" rows="2" placeholder="Isi / URL / Deskripsi..."></textarea>
                </div>
                <div class="grid-input">
                    <select id="itemFolderSelect">
                        <option value="Semua">📁 Tanpa Folder (Umum)</option>
                    </select>
                    <button id="saveItemBtnMain" class="btn-cyber"><i class="fas fa-save"></i> Simpan ke Vault</button>
                </div>
            </div>

            <!-- Filter & Search elegan -->
            <div class="search-row">
                <div class="search-box-modern">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Cari judul atau konten...">
                </div>
                <select id="typeFilterSelect" style="background:#0e1529; border-radius:2rem; padding:0 1rem; color:white; border-color:#2c4c6e;">
                    <option value="semua">Semua tipe</option>
                    <option value="teks">📄 Teks</option>
                    <option value="tautan">🔗 Tautan</option>
                    <option value="ide">💡 Ide</option>
                </select>
            </div>

            <div id="statInfo" style="font-size:0.8rem; margin-bottom:1rem; color:#7e9fc7;"><i class="fas fa-chart-line"></i> Memuat...</div>

            <!-- Grid Hasil -->
            <div id="itemsGridContainer" class="grid-cards">
                <div class="empty-state">✨ Vault kosong, ciptakan artefak pertamamu ✨</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============= CREDENTIALS =============
    const VALID_U = "admin";
    const VALID_P = "101010";

    // Data Structures
    let items = [];      // {id, title, type, value, folder, createdAt}
    let folders = ["Semua"];
    let currentFolder = "Semua";
    let searchTerm = "";
    let typeFilterGlobal = "semua";

    // DOM elements
    const loginWrapper = document.getElementById('loginWrapper');
    const dashboardApp = document.getElementById('dashboardApp');
    const loginUser = document.getElementById('loginUser');
    const loginPass = document.getElementById('loginPass');
    const doLogin = document.getElementById('doLogin');
    const loginErrorMsg = document.getElementById('loginErrorMsg');
    const logoutBtnGlobal = document.getElementById('logoutBtnGlobal');
    const folderSidebarList = document.getElementById('folderSidebarList');
    const createFolderBtn = document.getElementById('createFolderBtn');
    const newFolderField = document.getElementById('newFolderField');
    const itemTitleField = document.getElementById('itemTitleField');
    const itemTypeSelect = document.getElementById('itemTypeSelect');
    const itemValueField = document.getElementById('itemValueField');
    const itemFolderSelect = document.getElementById('itemFolderSelect');
    const saveItemBtnMain = document.getElementById('saveItemBtnMain');
    const globalSearch = document.getElementById('globalSearch');
    const typeFilterSelect = document.getElementById('typeFilterSelect');
    const statInfo = document.getElementById('statInfo');
    const itemsGridContainer = document.getElementById('itemsGridContainer');

    // helpers
    function saveToLocal() {
        localStorage.setItem('limestone_ultimate_items', JSON.stringify(items));
        let foldersToStore = folders.filter(f => f !== "Semua");
        localStorage.setItem('limestone_ultimate_folders', JSON.stringify(foldersToStore));
    }

    function loadFromLocal() {
        const storedItems = localStorage.getItem('limestone_ultimate_items');
        if(storedItems) {
            items = JSON.parse(storedItems);
        } else {
            items = [
                { id: Date.now()+1, title: "Selamat datang di LIMESTONE", type: "teks", value: "Anda bisa buat folder apapun. Klik + di sidebar untuk membuat kategori.", folder: "Semua", createdAt: new Date().toLocaleString() },
                { id: Date.now()+2, title: "Website Portfolio", type: "tautan", value: "https://github.com", folder: "Semua", createdAt: new Date().toLocaleString() },
                { id: Date.now()+3, title: "Project AI Assistant", type: "ide", value: "Gunakan LLM lokal untuk manajemen data", folder: "Semua", createdAt: new Date().toLocaleString() }
            ];
        }
        const storedFolders = localStorage.getItem('limestone_ultimate_folders');
        if(storedFolders) {
            let parsed = JSON.parse(storedFolders);
            folders = ["Semua", ...parsed.filter(f => f !== "Semua")];
        } else {
            folders = ["Semua"];
        }
        renderAll();
    }

    function renderAll() {
        renderFolderSidebar();
        updateFolderDropdown();
        renderItemsGrid();
    }

    function renderFolderSidebar() {
        folderSidebarList.innerHTML = '';
        folders.forEach(folder => {
            const li = document.createElement('li');
            li.className = `folder-node ${currentFolder === folder ? 'active' : ''}`;
            li.setAttribute('data-folder', folder);
            const icon = folder === "Semua" ? "<i class='fas fa-layer-group'></i>" : "<i class='fas fa-folder'></i>";
            li.innerHTML = `
                <span>${icon} ${escapeHtml(folder)}</span>
                ${folder !== "Semua" ? `<button class="delete-folder-icon" data-folder="${folder}" style="background:none; border:none; color:#ff8f7a; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>` : ''}
            `;
            li.addEventListener('click', (e) => {
                if(e.target.classList.contains('delete-folder-icon') || e.target.parentElement?.classList.contains('delete-folder-icon')) return;
                currentFolder = folder;
                renderAll();
            });
            folderSidebarList.appendChild(li);
        });
        // hapus folder
        document.querySelectorAll('.delete-folder-icon').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const folderName = btn.getAttribute('data-folder');
                if(confirm(`Hapus folder "${folderName}"? Semua item akan dipindah ke "Semua".`)) {
                    items.forEach(it => { if(it.folder === folderName) it.folder = "Semua"; });
                    folders = folders.filter(f => f !== folderName);
                    if(currentFolder === folderName) currentFolder = "Semua";
                    saveToLocal();
                    renderAll();
                }
            });
        });
    }

    function updateFolderDropdown() {
        itemFolderSelect.innerHTML = '';
        folders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f === "Semua" ? "📁 Umum / Tanpa Folder" : `📂 ${f}`;
            itemFolderSelect.appendChild(opt);
        });
    }

    function renderItemsGrid() {
        let filtered = items.filter(item => {
            if(currentFolder !== "Semua" && item.folder !== currentFolder) return false;
            if(searchTerm.trim() !== "") {
                const q = searchTerm.toLowerCase();
                return item.title.toLowerCase().includes(q) || item.value.toLowerCase().includes(q);
            }
            return true;
        });
        if(typeFilterGlobal !== "semua") {
            filtered = filtered.filter(item => item.type === typeFilterGlobal);
        }
        statInfo.innerHTML = `<i class="fas fa-chart-simple"></i> ${filtered.length} item • Folder: ${currentFolder} ${searchTerm ? '· filter aktif' : ''}`;
        if(filtered.length === 0) {
            itemsGridContainer.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i> Tidak ada artefak, tambah item baru.</div>`;
            return;
        }
        itemsGridContainer.innerHTML = '';
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'artifact-card';
            let iconVal = item.type === 'teks' ? '📄' : (item.type === 'tautan' ? '🔗' : '💡');
            let contentPreview = item.value;
            if(item.type === 'tautan' && (item.value.startsWith('http'))) {
                contentPreview = `<a href="${item.value}" target="_blank" style="color:#5fd4ff;">${item.value.substring(0, 50)}${item.value.length>50 ? '…' : ''}</a>`;
            } else {
                contentPreview = escapeHtml(item.value.length > 90 ? item.value.substring(0,90)+"…" : item.value);
            }
            card.innerHTML = `
                <div class="card-header">
                    <span style="font-weight:600;">${iconVal} ${escapeHtml(item.title)}</span>
                    <button class="delete-card" data-id="${item.id}"><i class="fas fa-times-circle"></i></button>
                </div>
                <div style="font-size:0.85rem; opacity:0.9; margin:0.5rem 0;">${contentPreview}</div>
                <div class="folder-badge"><i class="far fa-folder"></i> ${item.folder === "Semua" ? 'Umum' : item.folder} · <i class="far fa-clock"></i> ${item.createdAt || 'baru'}</div>
                <span class="badge-type">${item.type}</span>
            `;
            itemsGridContainer.appendChild(card);
        });
        document.querySelectorAll('.delete-card').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                items = items.filter(i => i.id !== id);
                saveToLocal();
                renderItemsGrid();
            });
        });
    }

    function addNewItem() {
        let title = itemTitleField.value.trim();
        let type = itemTypeSelect.value;
        let value = itemValueField.value.trim();
        let folder = itemFolderSelect.value;
        if(!title || !value) { alert("Judul dan konten wajib diisi"); return; }
        const newItem = {
            id: Date.now(),
            title, type, value, folder,
            createdAt: new Date().toLocaleString()
        };
        items.unshift(newItem);
        saveToLocal();
        renderItemsGrid();
        itemTitleField.value = '';
        itemValueField.value = '';
    }

    function createNewFolder() {
        let name = newFolderField.value.trim();
        if(!name) return;
        if(folders.includes(name)) { alert("Folder sudah ada"); return; }
        folders.push(name);
        saveToLocal();
        renderAll();
        newFolderField.value = '';
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // EVENT LISTENERS
    saveItemBtnMain.addEventListener('click', addNewItem);
    createFolderBtn.addEventListener('click', createNewFolder);
    globalSearch.addEventListener('input', (e) => { searchTerm = e.target.value; renderItemsGrid(); });
    typeFilterSelect.addEventListener('change', (e) => { typeFilterGlobal = e.target.value; renderItemsGrid(); });

    // LOGIC LOGIN
    function attemptLogin() {
        const user = loginUser.value.trim();
        const pass = loginPass.value.trim();
        if(user === VALID_U && pass === VALID_P) {
            localStorage.setItem('limestone_auth_flag', 'true');
            loginWrapper.style.opacity = '0';
            setTimeout(() => {
                loginWrapper.style.display = 'none';
                dashboardApp.style.display = 'block';
                setTimeout(() => { dashboardApp.style.opacity = '1'; }, 50);
                loadFromLocal();
            }, 400);
        } else {
            loginErrorMsg.style.display = 'block';
            setTimeout(() => loginErrorMsg.style.display = 'none', 1800);
        }
    }

    function logoutSystem() {
        localStorage.removeItem('limestone_auth_flag');
        dashboardApp.style.opacity = '0';
        setTimeout(() => {
            dashboardApp.style.display = 'none';
            loginWrapper.style.display = 'flex';
            loginWrapper.style.opacity = '1';
            loginUser.value = ''; loginPass.value = '';
        }, 300);
    }

    doLogin.addEventListener('click', attemptLogin);
    logoutBtnGlobal.addEventListener('click', logoutSystem);
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });

    // Session check
    const isAuth = localStorage.getItem('limestone_auth_flag');
    if(isAuth === 'true') {
        loginWrapper.style.display = 'none';
        dashboardApp.style.display = 'block';
        dashboardApp.style.opacity = '1';
        loadFromLocal();
    } else {
        loginWrapper.style.display = 'flex';
        dashboardApp.style.display = 'none';
    }
</script>
</body>
</html>
