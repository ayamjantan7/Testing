<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Artifact | Personal Digital Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-deep: #05070a;
            --bg-surface: rgba(12, 18, 28, 0.65);
            --border-glow: rgba(0, 255, 255, 0.25);
            --cyan-glow: #00f2ff;
            --cyan-dim: #00b8c4;
            --purple-accent: #b77cff;
            --text-primary: #f0f3fa;
            --text-secondary: #8e9eb5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated Gradient Orb Background */
        .orb-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }

        .orb-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.15), transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: float1 18s infinite ease-in-out;
        }

        .orb-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(183, 124, 255, 0.12), transparent 70%);
            border-radius: 50%;
            filter: blur(100px);
            animation: float2 22s infinite ease-in-out;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 5%) scale(1.05); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, -5%) scale(1.08); }
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='a'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23a)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        /* ========= LOGIN SCREEN ========= */
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.6);
            transition: all 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .login-card {
            background: rgba(8, 12, 22, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2.8rem;
            width: 92%;
            max-width: 440px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 242, 255, 0.1) inset;
            text-align: center;
        }

        .logo-symbol {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .login-card h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--cyan-glow), #b77cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }

        .input-neon {
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(0, 242, 255, 0.2);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            width: 100%;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-neon:focus {
            outline: none;
            border-color: var(--cyan-glow);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .btn-login {
            background: linear-gradient(95deg, #0f2b3d, #0a4c5c);
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 255, 0.25);
            background: linear-gradient(95deg, #1a4a6a, #0f7b8c);
        }

        /* ========= DASHBOARD ========= */
        .dashboard {
            display: none;
            min-height: 100vh;
        }

        /* Glass Navigation */
        .glass-nav {
            position: sticky;
            top: 20px;
            margin: 20px 28px 0 28px;
            background: rgba(8, 12, 22, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, var(--cyan-glow));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn-logout {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid #ff6b5c;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Main Grid Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.8rem;
            padding: 1.8rem 2rem;
        }

        /* Sidebar Elegant */
        .sidebar-elegant {
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 242, 255, 0.15);
            padding: 1.5rem;
            height: fit-content;
        }

        .section-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan-dim);
            margin-bottom: 1rem;
        }

        .folder-list {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .folder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.8rem;
            margin: 0.3rem 0;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .folder-item:hover {
            background: rgba(0, 242, 255, 0.08);
        }

        .folder-item.active {
            background: linear-gradient(90deg, rgba(0, 242, 255, 0.15), transparent);
            border-left: 3px solid var(--cyan-glow);
        }

        .create-folder-wrap {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .create-folder-wrap input {
            flex: 1;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 1rem;
            padding: 0.6rem;
            color: white;
        }

        /* Content Area */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Form Card Premium */
        .form-glass {
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 242, 255, 0.15);
            padding: 1.5rem;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 1.2rem;
            padding: 0.9rem 1rem;
            color: white;
            font-family: inherit;
        }

        .btn-prime {
            background: linear-gradient(95deg, #0f2b3d, #0b3b46);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 600;
            color: var(--cyan-glow);
            cursor: pointer;
            transition: 0.2s;
        }

        /* Search & Filter */
        .search-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 2;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 18px;
            top: 15px;
            color: #5f7f9f;
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 2rem;
            color: white;
        }

        .filter-select {
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 2rem;
            padding: 0 1.2rem;
            color: white;
        }

        /* Cards Grid Premium */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.3rem;
        }

        .artifact {
            background: linear-gradient(145deg, rgba(15, 22, 40, 0.85), rgba(5, 8, 18, 0.9));
            backdrop-filter: blur(8px);
            border-radius: 1.8rem;
            padding: 1.3rem;
            border: 1px solid rgba(0, 242, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .artifact:hover {
            transform: translateY(-6px);
            border-color: var(--cyan-glow);
            box-shadow: 0 15px 30px -12px rgba(0, 242, 255, 0.25);
        }

        .artifact-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .artifact-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .delete-artifact {
            background: none;
            border: none;
            color: #ff8c7a;
            cursor: pointer;
            font-size: 1rem;
        }

        .artifact-content {
            font-size: 0.85rem;
            color: #b8c7e8;
            margin: 0.6rem 0;
            word-break: break-word;
        }

        .artifact-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 0.6rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .badge {
            background: #0f4c5f;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
        }

        .empty-artifact {
            text-align: center;
            padding: 3rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            color: var(--text-secondary);
        }

        @media (max-width: 780px) {
            .main-grid { grid-template-columns: 1fr; padding: 1rem; }
            .glass-nav { margin: 15px; }
        }
    </style>
</head>
<body>
<div class="orb-bg">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
</div>
<div class="noise-overlay"></div>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="logo-symbol">✨</div>
        <h1>ARTIFACT</h1>
        <p style="margin: 0.5rem 0 2rem 0; color: #8ea3c2;">personal digital sanctuary</p>
        <div style="margin-bottom: 1rem;">
            <input type="text" id="usernameInput" class="input-neon" placeholder="username" autocomplete="off">
        </div>
        <div style="margin-bottom: 1.8rem;">
            <input type="password" id="passwordInput" class="input-neon" placeholder="password">
        </div>
        <button id="loginBtnAction" class="btn-login"><i class="fas fa-arrow-right"></i> Enter Vault</button>
        <div id="loginErrorMsg" style="color:#ff8f7a; font-size:0.75rem; margin-top:1rem; display:none;">Access denied</div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardApp" class="dashboard">
    <div class="glass-nav">
        <div class="brand"><i class="fas fa-crown"></i> ARTIFACT</div>
        <div id="logoutAction" class="btn-logout"><i class="fas fa-door-open"></i> Exit</div>
    </div>

    <div class="main-grid">
        <!-- SIDEBAR FOLDER -->
        <div class="sidebar-elegant">
            <div class="section-header"><i class="fas fa-folder-tree"></i> COLLECTIONS</div>
            <ul id="folderSidebar" class="folder-list">
                <li class="folder-item active" data-folder="All"><span><i class="fas fa-database"></i> All Items</span></li>
            </ul>
            <div class="create-folder-wrap">
                <input type="text" id="newFolderName" placeholder="new folder...">
                <button id="createFolderBtnAction" style="background:#0f2b3d; border:none; border-radius:1rem; padding:0 1rem; color:cyan;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content-area">
            <!-- CREATE ITEM -->
            <div class="form-glass">
                <div class="form-row">
                    <input type="text" id="itemTitle" placeholder="Title / Name">
                    <select id="itemType">
                        <option value="text">📄 Text Note</option>
                        <option value="link">🔗 Important Link</option>
                        <option value="idea">💡 Spark Idea</option>
                    </select>
                </div>
                <div class="form-row">
                    <textarea id="itemValue" rows="2" placeholder="Content / URL / Description"></textarea>
                </div>
                <div class="form-row">
                    <select id="itemFolderSelect">
                        <option value="All">📁 General</option>
                    </select>
                    <button id="saveItemBtn" class="btn-prime"><i class="fas fa-gem"></i> Save Artifact</button>
                </div>
            </div>

            <!-- SEARCH & FILTER -->
            <div class="search-section">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchGlobal" placeholder="search title or content...">
                </div>
                <select id="filterType" class="filter-select">
                    <option value="all">All types</option>
                    <option value="text">Text</option>
                    <option value="link">Link</option>
                    <option value="idea">Idea</option>
                </select>
            </div>

            <div id="statsInfo" style="font-size:0.75rem; color:#7e9fc7;"><i class="fas fa-chart-simple"></i> loading...</div>

            <!-- CARDS GRID -->
            <div id="cardsContainer" class="cards-grid">
                <div class="empty-artifact">✦ your vault is empty, create your first artifact ✦</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========= AUTH ==========
    const USER = "admin";
    const PASS = "101010";

    // ========= DATA ==========
    let items = [];
    let folders = ["All"];
    let currentFolder = "All";
    let searchTerm = "";
    let typeFilter = "all";

    // DOM elements
    const loginScreen = document.getElementById('loginScreen');
    const dashboardApp = document.getElementById('dashboardApp');
    const loginBtn = document.getElementById('loginBtnAction');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginErrorMsg = document.getElementById('loginErrorMsg');
    const logoutBtn = document.getElementById('logoutAction');
    const folderSidebar = document.getElementById('folderSidebar');
    const createFolderBtn = document.getElementById('createFolderBtnAction');
    const newFolderName = document.getElementById('newFolderName');
    const itemTitle = document.getElementById('itemTitle');
    const itemType = document.getElementById('itemType');
    const itemValue = document.getElementById('itemValue');
    const itemFolderSelect = document.getElementById('itemFolderSelect');
    const saveItemBtn = document.getElementById('saveItemBtn');
    const searchGlobal = document.getElementById('searchGlobal');
    const filterType = document.getElementById('filterType');
    const statsInfo = document.getElementById('statsInfo');
    const cardsContainer = document.getElementById('cardsContainer');

    // helpers
    function saveToLocal() {
        localStorage.setItem('artifact_items', JSON.stringify(items));
        let foldersToSave = folders.filter(f => f !== "All");
        localStorage.setItem('artifact_folders', JSON.stringify(foldersToSave));
    }

    function loadData() {
        const storedItems = localStorage.getItem('artifact_items');
        if(storedItems) {
            items = JSON.parse(storedItems);
        } else {
            items = [
                { id: Date.now()+1, title: "Welcome to Artifact", type: "text", value: "Create folders, save links, notes and ideas.", folder: "All", createdAt: new Date().toLocaleString() },
                { id: Date.now()+2, title: "Awesome Resource", type: "link", value: "https://github.com", folder: "All", createdAt: new Date().toLocaleString() },
                { id: Date.now()+3, title: "AI Project", type: "idea", value: "Build a local RAG system", folder: "All", createdAt: new Date().toLocaleString() }
            ];
        }
        const storedFolders = localStorage.getItem('artifact_folders');
        if(storedFolders) {
            let parsed = JSON.parse(storedFolders);
            folders = ["All", ...parsed];
        } else {
            folders = ["All"];
        }
        renderFull();
    }

    function renderFull() {
        renderSidebar();
        updateFolderSelect();
        renderCards();
    }

    function renderSidebar() {
        folderSidebar.innerHTML = '';
        folders.forEach(folder => {
            const li = document.createElement('li');
            li.className = `folder-item ${currentFolder === folder ? 'active' : ''}`;
            li.setAttribute('data-folder', folder);
            li.innerHTML = `
                <span><i class="fas ${folder === 'All' ? 'fa-database' : 'fa-folder'}"></i> ${escapeHtml(folder)}</span>
                ${folder !== "All" ? `<button class="del-folder-btn" data-folder="${folder}" style="background:none; border:none; color:#ff8c7a; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>` : ''}
            `;
            li.addEventListener('click', (e) => {
                if(e.target.classList.contains('del-folder-btn') || e.target.parentElement?.classList.contains('del-folder-btn')) return;
                currentFolder = folder;
                renderFull();
            });
            folderSidebar.appendChild(li);
        });
        document.querySelectorAll('.del-folder-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const folderName = btn.getAttribute('data-folder');
                if(confirm(`Delete "${folderName}"? All items move to "All".`)) {
                    items.forEach(it => { if(it.folder === folderName) it.folder = "All"; });
                    folders = folders.filter(f => f !== folderName);
                    if(currentFolder === folderName) currentFolder = "All";
                    saveToLocal();
                    renderFull();
                }
            });
        });
    }

    function updateFolderSelect() {
        itemFolderSelect.innerHTML = '';
        folders.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f;
            opt.textContent = f === "All" ? "📁 General" : `📂 ${f}`;
            itemFolderSelect.appendChild(opt);
        });
    }

    function renderCards() {
        let filtered = items.filter(item => {
            if(currentFolder !== "All" && item.folder !== currentFolder) return false;
            if(searchTerm.trim()) {
                const q = searchTerm.toLowerCase();
                return item.title.toLowerCase().includes(q) || item.value.toLowerCase().includes(q);
            }
            return true;
        });
        if(typeFilter !== "all") filtered = filtered.filter(item => item.type === typeFilter);
        statsInfo.innerHTML = `<i class="fas fa-chart-simple"></i> ${filtered.length} artifacts • ${currentFolder} ${searchTerm ? '· searching' : ''}`;
        if(filtered.length === 0) {
            cardsContainer.innerHTML = `<div class="empty-artifact"><i class="fas fa-hourglass-half"></i> no artifacts, start preserving.</div>`;
            return;
        }
        cardsContainer.innerHTML = '';
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'artifact';
            let icon = item.type === 'text' ? '📄' : (item.type === 'link' ? '🔗' : '⚡');
            let contentPreview = item.value;
            if(item.type === 'link' && item.value.match(/^https?:\/\//)) {
                contentPreview = `<a href="${item.value}" target="_blank" style="color:#5fd4ff;">${item.value.substring(0, 60)}${item.value.length > 60 ? '…' : ''}</a>`;
            } else {
                contentPreview = escapeHtml(item.value.length > 100 ? item.value.substring(0,100)+"…" : item.value);
            }
            card.innerHTML = `
                <div class="artifact-header">
                    <span class="artifact-title">${icon} ${escapeHtml(item.title)}</span>
                    <button class="delete-artifact" data-id="${item.id}"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="artifact-content">${contentPreview}</div>
                <div class="artifact-meta">
                    <span><i class="far fa-folder"></i> ${item.folder === "All" ? 'General' : item.folder}</span>
                    <span class="badge">${item.type}</span>
                </div>
                <div style="font-size:0.65rem; margin-top:0.5rem;"><i class="far fa-clock"></i> ${item.createdAt || 'just now'}</div>
            `;
            cardsContainer.appendChild(card);
        });
        document.querySelectorAll('.delete-artifact').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.getAttribute('data-id'));
                items = items.filter(i => i.id !== id);
                saveToLocal();
                renderCards();
            });
        });
    }

    function addItem() {
        let title = itemTitle.value.trim();
        let type = itemType.value;
        let value = itemValue.value.trim();
        let folder = itemFolderSelect.value;
        if(!title || !value) { alert("Title and content required"); return; }
        const newItem = {
            id: Date.now(),
            title, type, value, folder,
            createdAt: new Date().toLocaleString()
        };
        items.unshift(newItem);
        saveToLocal();
        renderCards();
        itemTitle.value = '';
        itemValue.value = '';
    }

    function createFolder() {
        let name = newFolderName.value.trim();
        if(!name) return;
        if(folders.includes(name)) { alert("Folder exists"); return; }
        folders.push(name);
        saveToLocal();
        renderFull();
        newFolderName.value = '';
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // LOGIN LOGIC
    function attemptLogin() {
        if(usernameInput.value.trim() === USER && passwordInput.value.trim() === PASS) {
            localStorage.setItem('artifact_auth', 'true');
            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.style.display = 'none';
                dashboardApp.style.display = 'block';
                loadData();
            }, 400);
        } else {
            loginErrorMsg.style.display = 'block';
            setTimeout(() => loginErrorMsg.style.display = 'none', 1500);
        }
    }

    function logout() {
        localStorage.removeItem('artifact_auth');
        dashboardApp.style.display = 'none';
        loginScreen.style.display = 'flex';
        loginScreen.style.opacity = '1';
        usernameInput.value = '';
        passwordInput.value = '';
    }

    loginBtn.addEventListener('click', attemptLogin);
    logoutBtn.addEventListener('click', logout);
    saveItemBtn.addEventListener('click', addItem);
    createFolderBtn.addEventListener('click', createFolder);
    searchGlobal.addEventListener('input', (e) => { searchTerm = e.target.value; renderCards(); });
    filterType.addEventListener('change', (e) => { typeFilter = e.target.value; renderCards(); });
    passwordInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });

    const authCheck = localStorage.getItem('artifact_auth');
    if(authCheck === 'true') {
        loginScreen.style.display = 'none';
        dashboardApp.style.display = 'block';
        loadData();
    }
</script>
</body>
</html>
