<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEXUS | Premium Digital Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0A0C15;
            --bg-secondary: #11161F;
            --glass-bg: rgba(18, 24, 36, 0.65);
            --accent-cyan: #00E5FF;
            --accent-purple: #B77CFF;
            --accent-pink: #FF6B9D;
            --text-main: #F0F3FA;
            --text-dim: #8E9EB5;
            --border-glow: rgba(0, 229, 255, 0.25);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ========= FALLING PARTICLES (SNOW/RAIN) ========= */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.6), rgba(183, 124, 255, 0.3));
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) translateX(20px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ========= RIPPLE CLICK EFFECT ========= */
        .ripple {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.6), rgba(183, 124, 255, 0.2));
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
            z-index: 10000;
        }

        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* ========= BACKGROUND ORBS ========= */
        .orb-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }
        .orb-1 { position: absolute; top: -20%; left: -10%; width: 70%; height: 70%; background: radial-gradient(circle, rgba(0, 200, 255, 0.12), transparent 70%); border-radius: 50%; filter: blur(80px); animation: float1 20s infinite; }
        .orb-2 { position: absolute; bottom: -20%; right: -10%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(183, 124, 255, 0.1), transparent 70%); border-radius: 50%; filter: blur(100px); animation: float2 25s infinite; }
        .orb-3 { position: absolute; top: 40%; left: 40%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(255, 107, 157, 0.08), transparent 70%); border-radius: 50%; filter: blur(120px); animation: float3 18s infinite; }
        @keyframes float1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5%,5%)} }
        @keyframes float2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-5%,-5%)} }
        @keyframes float3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(3%,-3%) scale(1.05)} }

        /* ========= LOGIN SCREEN ========= */
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(16px);
            background: rgba(0, 0, 0, 0.55);
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            padding: 2.8rem;
            width: 92%;
            max-width: 440px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,229,255,0.08) inset;
            text-align: center;
        }

        .login-card h1 { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.02em; }
        .input-premium { background: rgba(0,0,0,0.5); border: 1.5px solid rgba(0,229,255,0.2); border-radius: 1.2rem; padding: 1rem 1.2rem; width: 100%; color: white; font-size: 1rem; transition: 0.2s; }
        .input-premium:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0,229,255,0.3); }
        .btn-login { background: linear-gradient(95deg, #0f2b3d, #0a4c5c); width: 100%; padding: 1rem; border: none; border-radius: 1.5rem; font-weight: 700; font-size: 1rem; color: white; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,229,255,0.3); }

        /* ========= DASHBOARD ========= */
        .dashboard { display: none; min-height: 100vh; }

        /* NAVIGATION */
        .glass-nav { position: sticky; top: 20px; margin: 20px 28px 0 28px; background: rgba(8,12,22,0.75); backdrop-filter: blur(24px); border-radius: 2.5rem; border: 1px solid var(--border-glow); padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-wrap: wrap; }
        .brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #FFFFFF, var(--accent-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .btn-logout { background: rgba(255,70,70,0.12); border: 1px solid #ff6b5c; padding: 0.6rem 1.4rem; border-radius: 2rem; font-weight: 500; cursor: pointer; transition: 0.2s; }

        /* MAIN GRID */
        .main-grid { display: grid; grid-template-columns: 300px 1fr; gap: 1.8rem; padding: 1.8rem 2rem; }

        /* SIDEBAR */
        .sidebar-premium { background: rgba(8,12,22,0.5); backdrop-filter: blur(16px); border-radius: 2rem; border: 1px solid var(--border-glow); padding: 1.5rem; height: fit-content; }
        .section-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-cyan); margin-bottom: 1rem; }
        .folder-list { list-style: none; margin-bottom: 1.5rem; max-height: 400px; overflow-y: auto; }
        .folder-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0.9rem; margin: 0.3rem 0; border-radius: 1rem; cursor: pointer; transition: 0.2s; }
        .folder-item:hover { background: rgba(0,229,255,0.08); }
        .folder-item.active { background: linear-gradient(90deg, rgba(0,229,255,0.12), transparent); border-left: 3px solid var(--accent-cyan); }
        .create-folder-wrap { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .create-folder-wrap input { flex: 1; background: #0a1022; border: 1px solid #2c4c6e; border-radius: 1rem; padding: 0.7rem; color: white; }

        /* CONTENT AREA */
        .content-area { display: flex; flex-direction: column; gap: 1.5rem; }

        /* FORM (HANYA DI ALL) */
        .form-glass { background: rgba(8,12,22,0.5); backdrop-filter: blur(16px); border-radius: 2rem; border: 1px solid var(--border-glow); padding: 1.5rem; transition: 0.3s; }
        .form-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .form-row input, .form-row select, .form-row textarea { flex: 1; background: #0a1022; border: 1px solid #2c4c6e; border-radius: 1.2rem; padding: 0.9rem 1rem; color: white; font-family: inherit; }
        .btn-prime { background: linear-gradient(95deg, #0f2b3d, #0b3b46); border: none; padding: 0.8rem 2rem; border-radius: 2rem; font-weight: 600; color: var(--accent-cyan); cursor: pointer; transition: 0.2s; }

        /* SEARCH SECTION */
        .search-section { display: flex; gap: 1rem; flex-wrap: wrap; }
        .search-wrapper { flex: 2; position: relative; }
        .search-wrapper i { position: absolute; left: 18px; top: 15px; color: #5f7f9f; }
        .search-wrapper input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem; background: #0a1022; border: 1px solid #2c4c6e; border-radius: 2rem; color: white; }
        .filter-select { background: #0a1022; border: 1px solid #2c4c6e; border-radius: 2rem; padding: 0 1.2rem; color: white; }

        /* CARDS GRID */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.3rem; }
        .artifact-card { background: linear-gradient(145deg, rgba(15,22,40,0.85), rgba(5,8,18,0.9)); backdrop-filter: blur(8px); border-radius: 1.5rem; padding: 1.3rem; border: 1px solid rgba(0,229,255,0.15); cursor: pointer; transition: all 0.3s cubic-bezier(0.2,0.9,0.4,1.1); }
        .artifact-card:hover { transform: translateY(-4px); border-color: var(--accent-cyan); box-shadow: 0 12px 28px -12px rgba(0,229,255,0.2); }
        .artifact-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
        .artifact-title { font-weight: 700; font-size: 1rem; }
        .artifact-preview { font-size: 0.8rem; color: var(--text-dim); margin: 0.5rem 0; word-break: break-word; }
        .artifact-meta { display: flex; justify-content: space-between; margin-top: 0.5rem; font-size: 0.7rem; color: var(--text-dim); }
        .badge-type { background: #0f4c5f; padding: 0.2rem 0.7rem; border-radius: 2rem; font-size: 0.65rem; }

        /* MODAL EDIT (Membesar saat diklik) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: linear-gradient(145deg, #111827, #0A0F1A);
            border-radius: 2rem;
            width: 90%;
            max-width: 550px;
            padding: 2rem;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 30px rgba(0,229,255,0.2);
            transform: scale(0.9);
            transition: 0.3s;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card input, .modal-card textarea, .modal-card select { width: 100%; background: #0a1022; border: 1px solid #2c4c6e; border-radius: 1rem; padding: 0.8rem; margin-bottom: 1rem; color: white; }
        .modal-actions { display: flex; gap: 1rem; justify-content: flex-end; }
        .btn-save-edit { background: linear-gradient(95deg, #0f4c5f, #0b7b8c); border: none; padding: 0.7rem 1.5rem; border-radius: 2rem; color: white; cursor: pointer; }
        .btn-cancel-edit { background: rgba(255,70,70,0.2); border: 1px solid #ff6b5c; padding: 0.7rem 1.5rem; border-radius: 2rem; color: #ff8c7a; cursor: pointer; }

        .empty-state { text-align: center; padding: 3rem; background: rgba(0,0,0,0.3); border-radius: 2rem; color: var(--text-dim); }
        .stats-info { font-size: 0.75rem; color: #7e9fc7; }

        @media (max-width: 780px) { .main-grid { grid-template-columns: 1fr; padding: 1rem; } .glass-nav { margin: 15px; } }
    </style>
</head>
<body>

<div class="orb-bg"><div class="orb-1"></div><div class="orb-2"></div><div class="orb-3"></div></div>
<div id="particleContainer" class="particle-container"></div>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>✦ NEXUS ✦</h1>
        <p style="margin: 0.5rem 0 2rem 0; color: var(--text-dim);">premium digital vault</p>
        <div style="margin-bottom: 1rem;"><input type="text" id="loginUser" class="input-premium" placeholder="username" autocomplete="off"></div>
        <div style="margin-bottom: 1.8rem;"><input type="password" id="loginPass" class="input-premium" placeholder="password"></div>
        <button id="loginBtn" class="btn-login"><i class="fas fa-gem"></i> Enter Nexus</button>
        <div id="loginErr" style="color:#ff8f7a; font-size:0.75rem; margin-top:1rem; display:none;">Access denied</div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardApp" class="dashboard">
    <div class="glass-nav">
        <div class="brand"><i class="fas fa-crown"></i> NEXUS</div>
        <div id="logoutBtn" class="btn-logout"><i class="fas fa-door-open"></i> Exit</div>
    </div>

    <div class="main-grid">
        <!-- SIDEBAR -->
        <div class="sidebar-premium">
            <div class="section-header"><i class="fas fa-folder-tree"></i> COLLECTIONS</div>
            <ul id="folderSidebar" class="folder-list">
                <li class="folder-item active" data-folder="All"><span><i class="fas fa-database"></i> All Items</span></li>
            </ul>
            <div class="create-folder-wrap" id="createFolderWrapper">
                <input type="text" id="newFolderInput" placeholder="new folder...">
                <button id="createFolderBtn" style="background:#0f2b3d; border:none; border-radius:1rem; padding:0 1rem; color:cyan;"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content-area">
            <!-- FORM TAMBAH ITEM - HANYA MUNCUL DI "All" -->
            <div id="formContainer" class="form-glass">
                <div class="form-row">
                    <input type="text" id="itemTitle" placeholder="Title / Name">
                    <select id="itemType">
                        <option value="text">📄 Text Note</option>
                        <option value="link">🔗 Important Link</option>
                        <option value="idea">💡 Spark Idea</option>
                    </select>
                </div>
                <div class="form-row">
                    <textarea id="itemValue" rows="2" placeholder="Content / URL / Description"></textarea>
                </div>
                <div class="form-row">
                    <select id="itemFolderSelect">
                        <option value="All">📁 General</option>
                    </select>
                    <button id="saveItemBtn" class="btn-prime"><i class="fas fa-save"></i> Save Artifact</button>
                </div>
            </div>

            <!-- SEARCH SECTION (selalu ada) -->
            <div class="search-section">
                <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="search title or content..."></div>
                <select id="filterTypeSelect" class="filter-select"><option value="all">All types</option><option value="text">Text</option><option value="link">Link</option><option value="idea">Idea</option></select>
            </div>

            <div id="statsArea" class="stats-info"><i class="fas fa-chart-simple"></i> loading...</div>

            <!-- CARDS GRID -->
            <div id="cardsGrid" class="cards-grid"><div class="empty-state">✦ your vault is empty, create your first artifact ✦</div></div>
        </div>
    </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal-overlay">
    <div class="modal-card">
        <h3 style="margin-bottom: 1rem;"><i class="fas fa-pen"></i> Edit Artifact</h3>
        <input type="text" id="editTitle" placeholder="Title">
        <select id="editType">
            <option value="text">📄 Text Note</option>
            <option value="link">🔗 Link</option>
            <option value="idea">💡 Idea</option>
        </select>
        <textarea id="editValue" rows="4" placeholder="Content"></textarea>
        <div class="modal-actions">
            <button id="cancelEditBtn" class="btn-cancel-edit">Cancel</button>
            <button id="confirmEditBtn" class="btn-save-edit">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // ========= AUTH ==========
    const VALID_USER = "admin";
    const VALID_PASS = "101010";

    // ========= DATA ==========
    let items = [];
    let folders = ["All"];
    let currentFolder = "All";
    let searchTerm = "";
    let typeFilter = "all";
    let editingItemId = null;

    // DOM Elements
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboardApp');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const folderSidebar = document.getElementById('folderSidebar');
    const createFolderBtn = document.getElementById('createFolderBtn');
    const newFolderInput = document.getElementById('newFolderInput');
    const formContainer = document.getElementById('formContainer');
    const saveItemBtn = document.getElementById('saveItemBtn');
    const itemTitle = document.getElementById('itemTitle');
    const itemType = document.getElementById('itemType');
    const itemValue = document.getElementById('itemValue');
    const itemFolderSelect = document.getElementById('itemFolderSelect');
    const searchInput = document.getElementById('searchInput');
    const filterTypeSelect = document.getElementById('filterTypeSelect');
    const statsArea = document.getElementById('statsArea');
    const cardsGrid = document.getElementById('cardsGrid');
    const editModal = document.getElementById('editModal');
    const editTitle = document.getElementById('editTitle');
    const editType = document.getElementById('editType');
    const editValue = document.getElementById('editValue');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const confirmEditBtn = document.getElementById('confirmEditBtn');
    const createFolderWrapper = document.getElementById('createFolderWrapper');

    // ========= PARTICLES ==========
    function createParticle() {
        const container = document.getElementById('particleContainer');
        if(!container) return;
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = Math.random() * 5 + 4 + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(particle);
        setTimeout(() => { if(particle && particle.remove) particle.remove(); }, 10000);
    }
    setInterval(() => { for(let i=0;i<3;i++) createParticle(); }, 300);

    // ========= RIPPLE EFFECT ==========
    function addRipple(e) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (e.clientX - 20) + 'px';
        ripple.style.top = (e.clientY - 20) + 'px';
        ripple.style.width = '40px';
        ripple.style.height = '40px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    }
    document.addEventListener('click', (e) => { addRipple(e); });

    // ========= DATA MANAGEMENT ==========
    function saveToLocal() {
        localStorage.setItem('nexus_items', JSON.stringify(items));
        let foldersToSave = folders.filter(f => f !== "All");
        localStorage.setItem('nexus_folders', JSON.stringify(foldersToSave));
    }

    function loadData() {
        const storedItems = localStorage.getItem('nexus_items');
        if(storedItems) items = JSON.parse(storedItems);
        else items = [
            { id: Date.now()+1, title: "Welcome to Nexus", type: "text", value: "Premium vault with edit & search", folder: "All", createdAt: new Date().toLocaleString() },
            { id: Date.now()+2, title: "GitHub Resources", type: "link", value: "https://github.com", folder: "All", createdAt: new Date().toLocaleString() },
            { id: Date.now()+3, title: "AI Revolution", type: "idea", value: "Build personal assistant", folder: "All", createdAt: new Date().toLocaleString() }
        ];
        const storedFolders = localStorage.getItem('nexus_folders');
        if(storedFolders) folders = ["All", ...JSON.parse(storedFolders)];
        else folders = ["All"];
        renderAll();
    }

    function renderAll() { renderSidebar(); updateFolderSelect(); checkFormVisibility(); renderCards(); }
    function checkFormVisibility() { formContainer.style.display = (currentFolder === "All") ? "block" : "none"; createFolderWrapper.style.display = (currentFolder === "All") ? "flex" : "none"; }

    function renderSidebar() {
        folderSidebar.innerHTML = '';
        folders.forEach(folder => {
            const li = document.createElement('li');
            li.className = `folder-item ${currentFolder === folder ? 'active' : ''}`;
            li.setAttribute('data-folder', folder);
            li.innerHTML = `<span><i class="fas ${folder === 'All' ? 'fa-database' : 'fa-folder'}"></i> ${escapeHtml(folder)}</span>
                ${folder !== "All" ? `<button class="del-folder" data-folder="${folder}" style="background:none; border:none; color:#ff8c7a; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>` : ''}`;
            li.addEventListener('click', (e) => { if(e.target.classList.contains('del-folder') || e.target.parentElement?.classList.contains('del-folder')) return; currentFolder = folder; renderAll(); });
            folderSidebar.appendChild(li);
        });
        document.querySelectorAll('.del-folder').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); const fName = btn.getAttribute('data-folder'); if(confirm(`Delete "${fName}"? Items move to "All".`)) { items.forEach(it => { if(it.folder === fName) it.folder = "All"; }); folders = folders.filter(f => f !== fName); if(currentFolder === fName) currentFolder = "All"; saveToLocal(); renderAll(); } });
        });
    }

    function updateFolderSelect() {
        itemFolderSelect.innerHTML = '';
        folders.forEach(f => { let opt = document.createElement('option'); opt.value = f; opt.textContent = f === "All" ? "📁 General" : `📂 ${f}`; itemFolderSelect.appendChild(opt); });
    }

    function renderCards() {
        let filtered = items.filter(item => { if(currentFolder !== "All" && item.folder !== currentFolder) return false; if(searchTerm.trim()) { let q = searchTerm.toLowerCase(); return item.title.toLowerCase().includes(q) || item.value.toLowerCase().includes(q); } return true; });
        if(typeFilter !== "all") filtered = filtered.filter(item => item.type === typeFilter);
        statsArea.innerHTML = `<i class="fas fa-chart-simple"></i> ${filtered.length} artifacts • ${currentFolder === "All" ? "All Collections" : currentFolder}`;
        if(filtered.length === 0) { cardsGrid.innerHTML = `<div class="empty-state"><i class="fas fa-hourglass-half"></i> no artifacts found</div>`; return; }
        cardsGrid.innerHTML = '';
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'artifact-card';
            let icon = item.type === 'text' ? '📄' : (item.type === 'link' ? '🔗' : '⚡');
            let preview = item.value.length > 80 ? item.value.substring(0,80)+'…' : item.value;
            if(item.type === 'link' && item.value.match(/^https?:\/\//)) preview = <a href="${item.value}" target="_blank" style="color:#5fd4ff;" onclick="event.stopPropagation()">${preview}</a>;
            card.innerHTML = `<div class="artifact-header"><span class="artifact-title">${icon} ${escapeHtml(item.title)}</span><span class="badge-type">${item.type}</span></div>
                <div class="artifact-preview">${preview}</div><div class="artifact-meta"><span><i class="far fa-folder"></i> ${item.folder === "All" ? 'General' : item.folder}</span><span><i class="far fa-clock"></i> ${item.createdAt || 'new'}</span></div>`;
            card.addEventListener('click', (e) => { if(e.target.tagName !== 'A') openEditModal(item.id); });
            cardsGrid.appendChild(card);
        });
    }

    function addItem() {
        let title = itemTitle.value.trim();
        let type = itemType.value;
        let value = itemValue.value.trim();
        let folder = itemFolderSelect.value;
        if(!title || !value) { alert("Title and content required"); return; }
        items.unshift({ id: Date.now(), title, type, value, folder, createdAt: new Date().toLocaleString() });
        saveToLocal(); renderCards(); itemTitle.value = ''; itemValue.value = '';
    }

    function createFolder() { let name = newFolderInput.value.trim(); if(!name) return; if(folders.includes(name)) { alert("Folder exists"); return; } folders.push(name); saveToLocal(); renderAll(); newFolderInput.value = ''; }

    function openEditModal(id) { let item = items.find(i => i.id === id); if(!item) return; editingItemId = id; editTitle.value = item.title; editType.value = item.type; editValue.value = item.value; editModal.classList.add('active'); }
    function closeEditModal() { editModal.classList.remove('active'); editingItemId = null; }
    function saveEdit() { if(!editingItemId) return; let idx = items.findIndex(i => i.id === editingItemId); if(idx !== -1) { items[idx].title = editTitle.value.trim(); items[idx].type = editType.value; items[idx].value = editValue.value.trim(); items[idx].updatedAt = new Date().toLocaleString(); saveToLocal(); renderCards(); closeEditModal(); } }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // AUTH
    function attemptLogin() { if(document.getElementById('loginUser').value.trim() === VALID_USER && document.getElementById('loginPass').value.trim() === VALID_PASS) { localStorage.setItem('nexus_auth', 'true'); loginScreen.style.opacity = '0'; setTimeout(() => { loginScreen.style.display = 'none'; dashboard.style.display = 'block'; loadData(); }, 400); } else { document.getElementById('loginErr').style.display = 'block'; setTimeout(() => document.getElementById('loginErr').style.display = 'none', 1500); } }
    function logout() { localStorage.removeItem('nexus_auth'); dashboard.style.display = 'none'; loginScreen.style.display = 'flex'; loginScreen.style.opacity = '1'; }

    // EVENT LISTENERS
    loginBtn.addEventListener('click', attemptLogin);
    logoutBtn.addEventListener('click', logout);
    saveItemBtn.addEventListener('click', addItem);
    createFolderBtn.addEventListener('click', createFolder);
    searchInput.addEventListener('input', (e) => { searchTerm = e.target.value; renderCards(); });
    filterTypeSelect.addEventListener('change', (e) => { typeFilter = e.target.value; renderCards(); });
    cancelEditBtn.addEventListener('click', closeEditModal);
    confirmEditBtn.addEventListener('click', saveEdit);
    document.getElementById('loginPass').addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });
    editModal.addEventListener('click', (e) => { if(e.target === editModal) closeEditModal(); });

    if(localStorage.getItem('nexus_auth') === 'true') { loginScreen.style.display = 'none'; dashboard.style.display = 'block'; loadData(); }
</script>
</body>
</html>
