<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LIMESTONE | Penyimpanan Digital dengan Folder & Pencarian</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1f, #03060c);
            color: #eef5ff;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, #0a0f1f, #010101);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .login-card {
            background: rgba(15, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 20px rgba(0,255,255,0.2);
            text-align: center;
        }

        .login-card h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #aaffff, #2a9d8f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #2a4c6e;
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 8px #0ff;
        }

        .login-btn {
            background: linear-gradient(90deg, #0f2b3d, #0a4c5c);
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .error-msg {
            color: #ff9e8f;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(5, 10, 22, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,255,255,0.2);
            position: sticky;
            top: 0;
            z-index: 99;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c0ffff, #2a9d8f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logout-btn {
            background: rgba(255,70,70,0.2);
            border: 1px solid #ff7b72;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* Sidebar Folder */
        .sidebar {
            width: 280px;
            background: rgba(8, 15, 28, 0.6);
            backdrop-filter: blur(8px);
            border-right: 1px solid rgba(0,255,255,0.2);
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .sidebar h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #0ff;
        }

        .folder-list {
            list-style: none;
            margin-bottom: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .folder-item {
            padding: 0.7rem 0.8rem;
            margin: 0.3rem 0;
            border-radius: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-item:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .folder-item.active {
            background: rgba(0, 255, 255, 0.2);
            border-left: 3px solid #0ff;
        }

        .folder-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .delete-folder {
            background: none;
            border: none;
            color: #ff8a7a;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .delete-folder:hover {
            opacity: 1;
        }

        .add-folder {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .add-folder input {
            flex: 1;
            background: #0f1a2a;
            border: 1px solid #2c4c6e;
            padding: 0.5rem;
            border-radius: 0.8rem;
            color: white;
        }

        .add-folder button {
            background: #0ff22d20;
            border: 1px solid #0ff;
            padding: 0.5rem 1rem;
            border-radius: 0.8rem;
            cursor: pointer;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        /* Search & Filter Bar */
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7c9bc0;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: #0f1a2a;
            border: 1px solid #2c4c6e;
            border-radius: 1rem;
            color: white;
            font-size: 0.9rem;
        }

        .type-filter {
            padding: 0.8rem 1rem;
            background: #0f1a2a;
            border: 1px solid #2c4c6e;
            border-radius: 1rem;
            color: white;
            cursor: pointer;
        }

        .stats {
            font-size: 0.8rem;
            color: #8bb3d0;
            margin-bottom: 1rem;
        }

        /* Form Card */
        .form-card {
            background: rgba(10, 20, 35, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(0,255,255,0.3);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            background: #0f1a2a;
            border: 1px solid #2c4c6e;
            padding: 0.8rem;
            border-radius: 1rem;
            color: white;
            font-family: inherit;
        }

        .form-row textarea {
            width: 100%;
            resize: vertical;
        }

        .btn-primary {
            background: #0ff22d20;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Storage Grid */
        .storage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        .item-card {
            background: rgba(12, 22, 40, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 1rem;
            border-left: 4px solid #0ff;
            transition: 0.2s;
        }

        .item-card h4 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-type-badge {
            font-size: 0.65rem;
            background: #0a4c6e;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
        }

        .item-content {
            font-size: 0.85rem;
            color: #ccdeff;
            margin: 0.6rem 0;
            word-break: break-word;
        }

        .item-meta {
            font-size: 0.7rem;
            color: #7c9bc0;
            margin-top: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .delete-item {
            background: none;
            border: none;
            color: #ff9580;
            cursor: pointer;
        }

        .empty-message {
            text-align: center;
            padding: 3rem;
            color: #8bb3d0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(0,255,255,0.2);
            }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginContainer" class="login-container">
    <div class="login-card">
        <h1>🗃️ LIMESTONE</h1>
        <p>vault pintar dengan folder & pencarian</p>
        <div class="input-group">
            <input type="text" id="loginUsername" placeholder="Username" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Password">
        </div>
        <button class="login-btn" id="loginBtn"><i class="fas fa-unlock-alt"></i> Buka Vault</button>
        <div id="loginError" class="error-msg">❌ Username atau password salah</div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">
    <div class="navbar">
        <div class="logo"><i class="fas fa-database"></i> LIMESTONE</div>
        <div class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Keluar</div>
    </div>

    <div class="main-container">
        <!-- Sidebar Folder -->
        <div class="sidebar">
            <h3><i class="fas fa-folder"></i> Folder Saya</h3>
            <ul class="folder-list" id="folderList">
                <li class="folder-item active" data-folder="Semua">
                    <span class="folder-name"><i class="fas fa-inbox"></i> Semua Item</span>
                </li>
            </ul>
            <div class="add-folder">
                <input type="text" id="newFolderName" placeholder="Nama folder baru...">
                <button id="addFolderBtn"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Form Tambah Item -->
            <div class="form-card">
                <div class="form-row">
                    <input type="text" id="itemTitle" placeholder="Judul item...">
                    <select id="itemType">
                        <option value="teks">📝 Teks/Catatan</option>
                        <option value="tautan">🔗 Tautan/Link</option>
                        <option value="ide">💡 Ide Cepat</option>
                    </select>
                </div>
                <div class="form-row">
                    <textarea id="itemValue" rows="2" placeholder="Isi konten / URL..."></textarea>
                </div>
                <div class="form-row">
                    <select id="itemFolder">
                        <option value="Semua">📁 Tanpa Folder</option>
                    </select>
                    <button class="btn-primary" id="saveItemBtn"><i class="fas fa-save"></i> Simpan</button>
                </div>
            </div>

            <!-- Search & Filter -->
            <div class="search-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari judul atau isi...">
                </div>
                <select id="typeFilter" class="type-filter">
                    <option value="semua">Semua tipe</option>
                    <option value="teks">📝 Teks</option>
                    <option value="tautan">🔗 Tautan</option>
                    <option value="ide">💡 Ide</option>
                </select>
            </div>

            <div class="stats" id="statsDisplay">📊 0 item</div>

            <!-- Grid Item -->
            <div id="storageGrid" class="storage-grid">
                <div class="empty-message">✨ Belum ada item. Buat folder dan simpan sesuatu! ✨</div>
            </div>
        </div>
    </div>
</div>

<script>
    // KREDENSIAL
    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "101010";

    // Data structure
    let items = [];        // setiap item punya: id, title, type, value, folder, createdAt
    let folders = ["Semua"]; // "Semua" adalah virtual, tidak bisa dihapus

    let currentFolder = "Semua";
    let searchQuery = "";
    let typeFilter = "semua";

    // DOM
    const loginContainer = document.getElementById('loginContainer');
    const dashboard = document.getElementById('dashboard');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const folderListEl = document.getElementById('folderList');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const newFolderName = document.getElementById('newFolderName');
    const itemTitle = document.getElementById('itemTitle');
    const itemType = document.getElementById('itemType');
    const itemValue = document.getElementById('itemValue');
    const itemFolder = document.getElementById('itemFolder');
    const saveItemBtn = document.getElementById('saveItemBtn');
    const searchInput = document.getElementById('searchInput');
    const typeFilterEl = document.getElementById('typeFilter');
    const statsDisplay = document.getElementById('statsDisplay');
    const storageGrid = document.getElementById('storageGrid');

    // Load data
    function loadData() {
        const storedItems = localStorage.getItem('limestone_items_v2');
        if(storedItems) {
            items = JSON.parse(storedItems);
        } else {
            items = [
                { id: Date.now()+1, title: "Selamat Datang di LIMESTONE", type: "teks", value: "Anda bisa membuat folder sendiri! Coba buat folder 'Proyek' atau 'Rahasia'", folder: "Semua", createdAt: new Date().toLocaleString() },
                { id: Date.now()+2, title: "Contoh Tautan", type: "tautan", value: "https://github.com", folder: "Semua", createdAt: new Date().toLocaleString() },
                { id: Date.now()+3, title: "Ide Keren", type: "ide", value: "Buat website dengan AI", folder: "Semua", createdAt: new Date().toLocaleString() }
            ];
        }

        const storedFolders = localStorage.getItem('limestone_folders');
        if(storedFolders) {
            let tmp = JSON.parse(storedFolders);
            if(!tmp.includes("Semua")) tmp.unshift("Semua");
            folders = tmp;
        } else {
            folders = ["Semua"];
        }
        saveAll();
        renderFolderList();
        updateFolderSelect();
        renderItems();
    }

    function saveAll() {
        localStorage.setItem('limestone_items_v2', JSON.stringify(items));
        let saveFolders = folders.filter(f => f !== "Semua");
        localStorage.setItem('limestone_folders', JSON.stringify(saveFolders));
    }

    function renderFolderList() {
        folderListEl.innerHTML = '';
        folders.forEach(folder => {
            const li = document.createElement('li');
            li.className = `folder-item ${currentFolder === folder ? 'active' : ''}`;
            li.setAttribute('data-folder', folder);
            li.innerHTML = `
                <span class="folder-name"><i class="fas fa-${folder === 'Semua' ? 'inbox' : 'folder'}"></i> ${escapeHtml(folder)}</span>
                ${folder !== 'Semua' ? `<button class="delete-folder" data-folder="${folder}"><i class="fas fa-trash"></i></button>` : ''}
            `;
            li.addEventListener('click', (e) => {
                if(e.target.classList.contains('delete-folder')) return;
                currentFolder = folder;
                renderFolderList();
                renderItems();
            });
            folderListEl.appendChild(li);
        });

        document.querySelectorAll('.delete-folder').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const folderName = btn.getAttribute('data-folder');
                if(confirm(`Hapus folder "${folderName}"? Item di dalamnya akan dipindah ke "Semua".`)) {
                    items.forEach(item => {
                        if(item.folder === folderName) item.folder = "Semua";
                    });
                    folders = folders.filter(f => f !== folderName);
                    if(currentFolder === folderName) currentFolder = "Semua";
                    saveAll();
                    renderFolderList();
                    updateFolderSelect();
                    renderItems();
                }
            });
        });
    }

    function updateFolderSelect() {
        itemFolder.innerHTML = '';
        const optionAll = document.createElement('option');
        optionAll.value = "Semua";
        optionAll.textContent = "📁 Tanpa Folder (Semua)";
        itemFolder.appendChild(optionAll);
        
        folders.forEach(folder => {
            if(folder !== "Semua") {
                const opt = document.createElement('option');
                opt.value = folder;
                opt.textContent = `📂 ${folder}`;
                itemFolder.appendChild(opt);
            }
        });
    }

    function addFolder() {
        let name = newFolderName.value.trim();
        if(!name) return alert("Nama folder tidak boleh kosong");
        if(folders.includes(name)) return alert("Folder sudah ada");
        folders.push(name);
        saveAll();
        renderFolderList();
        updateFolderSelect();
        newFolderName.value = '';
    }

    function addItem() {
        let title = itemTitle.value.trim();
        let type = itemType.value;
        let value = itemValue.value.trim();
        let folder = itemFolder.value;

        if(!title) return alert("Judul harus diisi");
        if(!value) return alert("Konten harus diisi");

        const newItem = {
            id: Date.now(),
            title: title,
            type: type,
            value: value,
            folder: folder,
            createdAt: new Date().toLocaleString()
        };
        items.unshift(newItem);
        saveAll();
        renderItems();
        itemTitle.value = '';
        itemValue.value = '';
        itemType.value = 'teks';
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        saveAll();
        renderItems();
    }

    function renderItems() {
        // Filter berdasarkan folder, search, dan tipe
        let filtered = items.filter(item => {
            if(currentFolder !== "Semua" && item.folder !== currentFolder) return false;
            if(searchQuery !== "") {
                const q = searchQuery.toLowerCase();
                return item.title.toLowerCase().includes(q) || item.value.toLowerCase().includes(q);
            }
            return true;
        });

        if(typeFilter !== "semua") {
            filtered = filtered.filter(item => item.type === typeFilter);
        }

        // Update stats
        statsDisplay.innerHTML = `📊 ${filtered.length} item • Folder: ${currentFolder} ${searchQuery ? '• Pencarian: "'+searchQuery+'"' : ''}`;

        if(filtered.length === 0) {
            storageGrid.innerHTML = `<div class="empty-message">📭 Tidak ada item. Buat folder atau tambah item! 📭</div>`;
            return;
        }

        storageGrid.innerHTML = '';
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            let icon = item.type === 'teks' ? '📄' : (item.type === 'tautan' ? '🔗' : '💡');
            let displayValue = item.value;
            if(item.type === 'tautan' && (item.value.startsWith('http://') || item.value.startsWith('https://'))) {
                displayValue = `<a href="${item.value}" target="_blank" style="color:#6bd4ff;">${item.value.substring(0, 60)}${item.value.length>60 ? '…' : ''}</a>`;
            } else {
                displayValue = escapeHtml(item.value.length > 100 ? item.value.substring(0,100)+'…' : item.value);
            }

            card.innerHTML = `
                <h4>
                    <span>${icon} ${escapeHtml(item.title)}</span>
                    <button class="delete-item" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                </h4>
                <div class="item-content">${displayValue}</div>
                <div class="item-meta">
                    <span><i class="far fa-folder"></i> ${item.folder === "Semua" ? '📁 Umum' : '📂 '+item.folder}</span>
                    <span class="item-type-badge">${item.type}</span>
                </div>
                <div class="item-meta"><i class="far fa-clock"></i> ${item.createdAt || 'baru'}</div>
            `;
            storageGrid.appendChild(card);
        });

        document.querySelectorAll('.delete-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                deleteItem(id);
            });
        });
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // Search & filter event
    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderItems();
    });
    typeFilterEl.addEventListener('change', (e) => {
        typeFilter = e.target.value;
        renderItems();
    });

    // Auth
    function performLogin() {
        const user = document.getElementById('loginUsername').value.trim();
        const pass = document.getElementById('loginPassword').value.trim();
        if(user === VALID_USERNAME && pass === VALID_PASSWORD) {
            localStorage.setItem('limestone_auth_v2', 'true');
            loginContainer.style.opacity = '0';
            loginContainer.style.visibility = 'hidden';
            setTimeout(() => {
                loginContainer.style.display = 'none';
                dashboard.style.display = 'block';
                loadData();
            }, 300);
        } else {
            loginError.style.display = 'block';
            setTimeout(() => { loginError.style.display = 'none'; }, 2000);
        }
    }

    function logout() {
        localStorage.removeItem('limestone_auth_v2');
        dashboard.style.display = 'none';
        loginContainer.style.display = 'flex';
        loginContainer.style.opacity = '1';
        loginContainer.style.visibility = 'visible';
    }

    function checkAuth() {
        const isAuth = localStorage.getItem('limestone_auth_v2');
        if(isAuth === 'true') {
            loginContainer.style.display = 'none';
            dashboard.style.display = 'block';
            loadData();
        } else {
            loginContainer.style.display = 'flex';
            dashboard.style.display = 'none';
        }
    }

    loginBtn.addEventListener('click', performLogin);
    logoutBtn.addEventListener('click', logout);
    addFolderBtn.addEventListener('click', addFolder);
    saveItemBtn.addEventListener('click', addItem);
    document.getElementById('loginPassword').addEventListener('keypress', (e) => { if(e.key === 'Enter') performLogin(); });

    checkAuth();
</script>
</body>
</html>
