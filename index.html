<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>✦ HANS FILE ✦ | Ultimate Digital Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #05070A;
            --bg-card: rgba(12, 18, 28, 0.75);
            --border-cyan: rgba(0, 229, 255, 0.3);
            --cyan: #00E5FF;
            --purple: #B77CFF;
            --pink: #FF6B9D;
            --text-main: #F0F3FA;
            --text-dim: #8E9EB5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ========= BACKGROUND ORBS ========= */
        .orb-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }
        .orb-1, .orb-2, .orb-3 {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            animation: floatAnim 20s infinite ease-in-out;
        }
        .orb-1 { top: -20%; left: -10%; width: 70%; height: 70%; background: radial-gradient(circle, rgba(0,229,255,0.12), transparent 70%); }
        .orb-2 { bottom: -20%; right: -10%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(183,124,255,0.1), transparent 70%); animation-delay: -5s; }
        .orb-3 { top: 40%; left: 40%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(255,107,157,0.08), transparent 70%); animation-delay: -10s; }
        @keyframes floatAnim { 0%,100%{transform:translate(0,0)} 50%{transform:translate(3%,3%)} }

        /* ========= FALLING PARTICLES ========= */
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--cyan), var(--purple));
            border-radius: 50%;
            opacity: 0;
            animation: fallParticle linear forwards;
        }
        @keyframes fallParticle {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0.6; }
            100% { transform: translateY(110vh) translateX(30px); opacity: 0; }
        }

        /* ========= RIPPLE CLICK ========= */
        .ripple-effect {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,229,255,0.6), rgba(183,124,255,0.3));
            transform: scale(0);
            animation: rippleAnim 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 10000;
        }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* ========= LOGIN SCREEN ========= */
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.6);
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .login-card {
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            padding: 2.8rem;
            width: 92%;
            max-width: 440px;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,229,255,0.1) inset;
            text-align: center;
        }
        .login-card h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .input-premium {
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(0, 229, 255, 0.2);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            width: 100%;
            color: white;
            font-size: 1rem;
            transition: 0.2s;
        }
        .input-premium:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }
        .btn-login {
            background: linear-gradient(95deg, #0f2b3d, #0a4c5c);
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.3);
        }

        /* ========= DASHBOARD ========= */
        .dashboard {
            display: none;
            min-height: 100vh;
        }

        /* NAVIGATION */
        .glass-nav {
            position: sticky;
            top: 20px;
            margin: 20px 28px 0 28px;
            background: rgba(8, 12, 22, 0.75);
            backdrop-filter: blur(24px);
            border-radius: 2.5rem;
            border: 1px solid var(--border-cyan);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
        }
        .brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-menu {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .nav-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--border-cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .nav-btn.active {
            background: rgba(0, 229, 255, 0.25);
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .btn-logout {
            background: rgba(255, 70, 70, 0.12);
            border: 1px solid #ff6b5c;
            padding: 0.6rem 1.4rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        /* MAIN GRID */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.8rem;
            padding: 1.8rem 2rem;
        }

        /* SIDEBAR */
        .sidebar-premium {
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid var(--border-cyan);
            padding: 1.5rem;
            height: fit-content;
        }
        .section-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-bottom: 1rem;
        }
        .folder-list {
            list-style: none;
            margin-bottom: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .folder-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0.9rem;
            margin: 0.3rem 0;
            border-radius: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .folder-item:hover {
            background: rgba(0, 229, 255, 0.08);
        }
        .folder-item.active {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.12), transparent);
            border-left: 3px solid var(--cyan);
        }
        .create-folder-wrap {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .create-folder-wrap input {
            flex: 1;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 1rem;
            padding: 0.7rem;
            color: white;
        }
        .create-folder-wrap button {
            background: #0f2b3d;
            border: none;
            border-radius: 1rem;
            padding: 0 1rem;
            color: var(--cyan);
            cursor: pointer;
        }

        /* CONTENT AREA */
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* DASHBOARD HOME CARDS */
        .dashboard-home {
            display: block;
        }
        .dashboard-vault {
            display: none;
        }
        .home-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .home-card {
            background: linear-gradient(145deg, rgba(15, 22, 40, 0.85), rgba(5, 8, 18, 0.9));
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.8rem;
            border: 1px solid var(--border-cyan);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
        }
        .home-card:hover {
            transform: translateY(-6px);
            border-color: var(--cyan);
            box-shadow: 0 15px 35px -12px rgba(0, 229, 255, 0.3);
        }
        .home-card-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .home-card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .home-card-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .shortcut-notes-container {
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid var(--border-cyan);
            padding: 1.5rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .shortcut-notes-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--cyan);
        }
        .shortcut-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 0.8rem;
            border-left: 3px solid var(--cyan);
        }
        .shortcut-code {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        .shortcut-text {
            font-size: 0.8rem;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .copy-btn {
            background: rgba(0, 229, 255, 0.15);
            border: none;
            border-radius: 0.5rem;
            padding: 0.2rem 0.6rem;
            color: var(--cyan);
            cursor: pointer;
            font-size: 0.7rem;
            margin-top: 0.3rem;
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 229, 255, 0.9);
            color: #05070A;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            z-index: 10000;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-20px); visibility: hidden; }
        }

        /* FORM TAMBAH ITEM */
        .form-glass {
            background: rgba(8, 12, 22, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid var(--border-cyan);
            padding: 1.5rem;
            transition: 0.3s;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .form-row input, .form-row select, .form-row textarea {
            flex: 1;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 1.2rem;
            padding: 0.9rem 1rem;
            color: white;
            font-family: inherit;
        }
        .btn-prime {
            background: linear-gradient(95deg, #0f2b3d, #0b3b46);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 600;
            color: var(--cyan);
            cursor: pointer;
            transition: 0.2s;
        }

        /* SEARCH SECTION */
        .search-section {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .search-wrapper {
            flex: 2;
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 18px;
            top: 15px;
            color: #5f7f9f;
        }
        .search-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 2rem;
            color: white;
        }
        .filter-select {
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 2rem;
            padding: 0 1.2rem;
            color: white;
            cursor: pointer;
        }

        /* CARDS GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.3rem;
        }
        .artifact-card {
            background: linear-gradient(145deg, rgba(15, 22, 40, 0.85), rgba(5, 8, 18, 0.9));
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.3rem;
            border: 1px solid rgba(0, 229, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .artifact-card:hover {
            transform: translateY(-4px);
            border-color: var(--cyan);
            box-shadow: 0 12px 28px -12px rgba(0, 229, 255, 0.2);
        }
        .artifact-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
        }
        .artifact-title {
            font-weight: 700;
            font-size: 1rem;
        }
        .artifact-preview {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin: 0.5rem 0;
            word-break: break-word;
        }
        .artifact-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.7rem;
            color: var(--text-dim);
        }
        .badge-type {
            background: #0f4c5f;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.65rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2rem;
            color: var(--text-dim);
        }
        .stats-info {
            font-size: 0.75rem;
            color: #7e9fc7;
        }

        /* MODAL VIEW */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: linear-gradient(145deg, #111827, #0A0F1A);
            border-radius: 2rem;
            width: 90%;
            max-width: 550px;
            padding: 2rem;
            border: 1px solid var(--cyan);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.2);
            transform: scale(0.9);
            transition: 0.3s;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-view-content {
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            word-break: break-word;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .modal-view-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }
        .modal-view-meta {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .btn-edit-modal {
            background: linear-gradient(95deg, #0f4c5f, #0b7b8c);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
        }
        .btn-close-modal {
            background: rgba(255, 70, 70, 0.2);
            border: 1px solid #ff6b5c;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: #ff8c7a;
            cursor: pointer;
        }

        /* MODAL EDIT */
        .edit-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .edit-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .edit-modal-card {
            background: linear-gradient(145deg, #111827, #0A0F1A);
            border-radius: 2rem;
            width: 90%;
            max-width: 550px;
            padding: 2rem;
            border: 1px solid var(--pink);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 107, 157, 0.2);
            transform: scale(0.9);
            transition: 0.3s;
        }
        .edit-modal-overlay.active .edit-modal-card {
            transform: scale(1);
        }
        .edit-modal-card input, .edit-modal-card textarea, .edit-modal-card select {
            width: 100%;
            background: #0a1022;
            border: 1px solid #2c4c6e;
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 1rem;
            color: white;
            font-family: inherit;
        }
        .btn-save-edit {
            background: linear-gradient(95deg, #0f4c5f, #0b7b8c);
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
        }
        .btn-cancel-edit {
            background: rgba(255, 70, 70, 0.2);
            border: 1px solid #ff6b5c;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: #ff8c7a;
            cursor: pointer;
        }

        @media (max-width: 780px) {
            .main-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            .glass-nav {
                margin: 15px;
            }
            .nav-menu {
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body>

<div class="orb-bg">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>
</div>
<div id="particleContainer" class="particle-container"></div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>✦ NEXUS ✦</h1>
        <p style="margin: 0.5rem 0 2rem 0; color: var(--text-dim);">premium digital vault</p>
        <div style="margin-bottom: 1rem;">
            <input type="text" id="loginUsername" class="input-premium" placeholder="username" autocomplete="off">
        </div>
        <div style="margin-bottom: 1.8rem;">
            <input type="password" id="loginPassword" class="input-premium" placeholder="password">
        </div>
        <button id="loginButton" class="btn-login"><i class="fas fa-gem"></i> Enter Nexus</button>
        <div id="loginErrorMsg" style="color: #ff8f7a; font-size: 0.75rem; margin-top: 1rem; display: none;">Access denied</div>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardApp" class="dashboard">
    <div class="glass-nav">
        <div class="brand"><i class="fas fa-crown"></i> NEXUS</div>
        <div class="nav-menu">
            <div id="homeNavBtn" class="nav-btn active"><i class="fas fa-home"></i> Home</div>
            <div id="vaultNavBtn" class="nav-btn"><i class="fas fa-database"></i> Vault</div>
            <div id="logoutButton" class="btn-logout"><i class="fas fa-door-open"></i> Exit</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- SIDEBAR FOLDER (hanya tampil di Vault) -->
        <div id="sidebarContainer" class="sidebar-premium" style="display: none;">
            <div class="section-header"><i class="fas fa-folder-tree"></i> COLLECTIONS</div>
            <ul id="folderSidebarList" class="folder-list">
                <li class="folder-item active" data-folder="All"><span><i class="fas fa-database"></i> All Items</span></li>
            </ul>
            <div id="createFolderWrapper" class="create-folder-wrap">
                <input type="text" id="newFolderNameInput" placeholder="new folder...">
                <button id="createFolderButton"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="content-area">
            <!-- DASHBOARD HOME -->
            <div id="homeView" class="dashboard-home">
                <div class="home-cards-grid">
                    <!-- Card AutoHotkeys -->
                    <div id="ahkCard" class="home-card">
                        <div class="home-card-icon"><i class="fas fa-bolt"></i></div>
                        <div class="home-card-title">AutoHotkeys</div>
                        <div class="home-card-desc">Klik untuk mendownload AutoHotkey v2</div>
                    </div>
                    <!-- Card Shortcut Notes -->
                    <div id="notesCard" class="home-card">
                        <div class="home-card-icon"><i class="fas fa-sticky-note"></i></div>
                        <div class="home-card-title">Shortcut Notes</div>
                        <div class="home-card-desc">Koleksi shortcut / untuk AutoHotkey</div>
                    </div>
                </div>
                
                <!-- Shortcut Notes Container (tampil saat klik card notes) -->
                <div id="shortcutContainer" class="shortcut-notes-container" style="display: none;">
                    <div class="shortcut-notes-title"><i class="fas fa-copy"></i> Shortcut AutoHotkey</div>
                    <div id="shortcutList"></div>
                </div>
            </div>

            <!-- VAULT VIEW (Form, Search, Cards) -->

    // ============== FALLING PARTICLES ==============
    function createFallingParticle() {
        const container = document.getElementById('particleContainer');
        if (!container) return;
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 4 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = Math.random() * 5 + 3 + 's';
        particle.style.animationDelay = Math.random() * 3 + 's';
        particle.style.opacity = Math.random() * 0.5 + 0.2;
        container.appendChild(particle);
        setTimeout(() => {
            if (particle && particle.remove) particle.remove();
        }, 8000);
    }
    setInterval(() => {
        for (let i = 0; i < 4; i++) {
            createFallingParticle();
        }
    }, 200);

    function addRippleEffect(event) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-effect';
        ripple.style.left = (event.clientX - 15) + 'px';
        ripple.style.top = (event.clientY - 15) + 'px';
        ripple.style.width = '30px';
        ripple.style.height = '30px';
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 500);
    }
    document.addEventListener('click', function(e) {

    // ============== HELPER FUNCTIONS ==============
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function saveToLocalStorage() {
        localStorage.setItem('nexus_items', JSON.stringify(items));
        const foldersToSave = folders.filter(f => f !== "All");
        localStorage.setItem('nexus_folders', JSON.stringify(foldersToSave));
    }

    function loadFromLocalStorage() {
        const storedItems = localStorage.getItem('nexus_items');
        if (storedItems) {
            items = JSON.parse(storedItems);
        } else {
            items = [
                { id: Date.now() + 1, title: "Welcome to Nexus", type: "text", value: "Premium vault with Home Dashboard! Click Vault to manage your items.", folder: "All", createdAt: new Date().toLocaleString() },

                { id: Date.now() + 3, title: "AI Revolution", type: "idea", value: "Build a personal AI assistant with local LLM", folder: "All", createdAt: new Date().toLocaleString() }
            ];
        }
        const storedFolders = localStorage.getItem('nexus_folders');
        if (storedFolders) {
            const parsed = JSON.parse(storedFolders);

    }

    function renderShortcutNotes() {
        shortcutList.innerHTML = '';
        shortcutData.forEach(shortcut => {
            const item = document.createElement('div');
            item.className = 'shortcut-item';
            item.innerHTML = `
                <div class="shortcut-code">${escapeHtml(shortcut.code)}</div>
                <div class="shortcut-text">${escapeHtml(shortcut.text)}</div>
                <button class="copy-btn" data-code="${escapeHtml(shortcut.code)}" data-text="${escapeHtml(shortcut.text)}"><i class="fas fa-copy"></i> Copy</button>
            `;
            shortcutList.appendChild(item);
        });
        
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const code = btn.getAttribute('data-code');
                const text = btn.getAttribute('data-text');
                const fullText = `${code}\n${text}`;
                navigator.clipboard.writeText(fullText);
                showToast(`✓ ${code} copied!`);
            });
        });
    }

            li.className = `folder-item ${currentFolder === folder ? 'active' : ''}`;
            li.setAttribute('data-folder', folder);
            li.innerHTML = `
                <span><i class="fas ${folder === 'All' ? 'fa-database' : 'fa-folder'}"></i> ${escapeHtml(folder)}</span>
                ${folder !== "All" ? `<button class="delete-folder-btn" data-folder="${folder}" style="background:none; border:none; color:#ff8c7a; cursor:pointer;"><i class="fas fa-trash-alt"></i></button>` : ''}
            `;
            li.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-folder-btn') || e.target.parentElement?.classList.contains('delete-folder-btn')) return;
                currentFolder = folder;
                renderAll();
            });
            folderSidebarList.appendChild(li);
        });

        document.querySelectorAll('.delete-folder-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const folderName = btn.getAttribute('data-folder');
                if (confirm(`Delete folder "${folderName}"? All items inside will move to "All".`)) {
                    items.forEach(item => {
                        if (item.folder === folderName) item.folder = "All";
                    });
                    folders = folders.filter(f => f !== folderName);
                    if (currentFolder === folderName) currentFolder = "All";
                    saveToLocalStorage();
                    renderAll();
                }
            });
        });
    }

    function updateFolderSelect() {
        itemFolderSelect.innerHTML = '';
        folders.forEach(folder => {
            const option = document.createElement('option');
            option.value = folder;
            option.textContent = folder === "All" ? "📁 General" : `📂 ${folder}`;
            itemFolderSelect.appendChild(option);
        });
    }

    function renderCards() {
        let filteredItems = items.filter(item => {
            if (currentFolder !== "All" && item.folder !== currentFolder) return false;
            if (searchTerm.trim() !== "") {
                const query = searchTerm.toLowerCase();
                return item.title.toLowerCase().includes(query) || item.value.toLowerCase().includes(query);
            }
            return true;
        });

        if (typeFilter !== "all") {
            filteredItems = filteredItems.filter(item => item.type === typeFilter);
        }

        const itemCount = filteredItems.length;
        statsArea.innerHTML = `<i class="fas fa-chart-simple"></i> ${itemCount} artifact${itemCount !== 1 ? 's' : ''} • ${currentFolder === "All" ? "All Collections" : escapeHtml(currentFolder)} ${searchTerm ? '• searching: "' + escapeHtml(searchTerm) + '"' : ''}`;

        if (filteredItems.length === 0) {
            cardsGridContainer.innerHTML = `<div class="empty-state"><i class="fas fa-hourglass-half"></i> no artifacts found</div>`;
            return;
        }

        cardsGridContainer.innerHTML = '';
        filteredItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'artifact-card';
            const icon = item.type === 'text' ? '📄' : (item.type === 'link' ? '🔗' : '⚡');
            let preview = item.value.length > 100 ? item.value.substring(0, 100) + '…' : item.value;
            
            if (item.type === 'link' && item.value.match(/^https?:\/\//)) {
                preview = `<a href="${item.value}" target="_blank" style="color: #5fd4ff; text-decoration: none;" onclick="event.stopPropagation()">${escapeHtml(preview)}</a>`;
            } else {
                preview = escapeHtml(preview);
            }

            card.innerHTML = `
                <div class="artifact-header">
                    <span class="artifact-title">${icon} ${escapeHtml(item.title)}</span>
                    <span class="badge-type">${item.type}</span>
                </div>
                <div class="artifact-preview">${preview}</div>
                <div class="artifact-meta">
                    <span><i class="far fa-folder"></i> ${item.folder === "All" ? 'General' : escapeHtml(item.folder)}</span>
                    <span><i class="far fa-clock"></i> ${item.createdAt || 'new'}</span>
                </div>
            `;
            card.addEventListener('click', (e) => {
                if (e.target.tagName !== 'A') {
                    openViewModal(item.id);
                }
            });
            cardsGridContainer.appendChild(card);
        });
    }

    // ============== VIEW MODAL ==============
    function openViewModal(itemId) {
        const item = items.find(i => i.id === itemId);
        if (!item) return;
        viewingItemId = itemId;
        
        const icon = item.type === 'text' ? '📄' : (item.type === 'link' ? '🔗' : '⚡');
        viewModalTitle.innerHTML = `${icon} ${escapeHtml(item.title)}`;
        viewModalMeta.innerHTML = `<i class="far fa-folder"></i> ${item.folder === "All" ? 'General' : escapeHtml(item.folder)} • <i class="far fa-clock"></i> ${item.createdAt || 'just now'} • <span class="badge-type" style="background:#0f4c5f; padding:0.2rem 0.5rem;">${item.type}</span>`;
        
        let content = item.value;
        if (item.type === 'link' && item.value.match(/^https?:\/\//)) {
            content = `<a href="${item.value}" target="_blank" style="color: #5fd4ff;">${escapeHtml(item.value)}</a>`;
        } else {
            content = escapeHtml(item.value);
        }
        viewModalContent.innerHTML = content;
        
        viewModalOverlay.classList.add('active');
    }

    function closeViewModal() {
        viewModalOverlay.classList.remove('active');
        viewingItemId = null;
    }

    // ============== EDIT MODAL ==============
    function openEditModal(itemId) {
        const item = items.find(i => i.id === itemId);
        if (!item) return;
        editingItemId = itemId;
        editTitleInput.value = item.title;
        editTypeSelect.value = item.type;
        editValueInput.value = item.value;
        editModalOverlay.classList.add('active');
    }

    function closeEditModal() {
        editModalOverlay.classList.remove('active');
        editingItemId = null;
    }

    function saveEditChanges() {
        if (!editingItemId) return;
        const index = items.findIndex(i => i.id === editingItemId);
        if (index !== -1) {
            items[index].title = editTitleInput.value.trim();
            items[index].type = editTypeSelect.value;
            items[index].value = editValueInput.value.trim();
            items[index].updatedAt = new Date().toLocaleString();
            saveToLocalStorage();
            renderCards();
            closeEditModal();
            closeViewModal();
            showToast("✓ Artifact updated!");
        }
    }

    // ============== CRUD OPERATIONS ==============
    function addNewItem() {
        const title = itemTitleInput.value.trim();
        const type = itemTypeSelect.value;
        const value = itemValueInput.value.trim();
        const folder = itemFolderSelect.value;

        if (!title) {
            alert("Please enter a title");
            return;
        }
        if (!value) {
            alert("Please enter content");
            return;
        }

        const newItem = {
            id: Date.now(),
            title: title,
            type: type,
            value: value,
            folder: folder,
            createdAt: new Date().toLocaleString()
        };
        items.unshift(newItem);
        saveToLocalStorage();
        renderCards();
        itemTitleInput.value = '';
        itemValueInput.value = '';
        showToast("✓ Artifact saved!");
    }

    function createNewFolder() {
        const folderName = newFolderNameInput.value.trim();
        if (!folderName) {
            alert("Please enter a folder name");
            return;
        }
        if (folders.includes(folderName)) {
            alert("Folder already exists");
            return;
        }
        folders.push(folderName);
        saveToLocalStorage();
        renderAll();
        newFolderNameInput.value = '';
        showToast(`✓ Folder "${folderName}" created!`);
    }

    // ============== DOWNLOAD AHK ==============
    function downloadAHK() {
        const link = document.createElement('a');
        link.href = "https://www.autohotkey.com/download/ahk-v2.exe";
        link.download = "ahk-v2.exe";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("✓ Downloading AutoHotkey v2...");
    }

    // ============== LOGIN/LOGOUT ==============
    function attemptLogin() {
        const username = loginUsername.value.trim();
        const password = loginPassword.value.trim();
        
        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
            localStorage.setItem('nexus_auth', 'true');
            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.style.display = 'none';
                dashboardApp.style.display = 'block';
                loadFromLocalStorage();
                renderShortcutNotes();
                switchToHome();
            }, 400);
        } else {
            loginErrorMsg.style.display = 'block';
            setTimeout(() => {
                loginErrorMsg.style.display = 'none';
            }, 2000);
        }
    }

    function logout() {
        localStorage.removeItem('nexus_auth');
        dashboardApp.style.opacity = '0';
        setTimeout(() => {
            dashboardApp.style.display = 'none';
            loginScreen.style.display = 'flex';
            loginScreen.style.opacity = '1';
            loginUsername.value = '';
            loginPassword.value = '';
            dashboardApp.style.opacity = '1';
        }, 300);
    }

    // ============== EVENT LISTENERS ==============
    loginButton.addEventListener('click', attemptLogin);
    logoutButton.addEventListener('click', logout);
    homeNavBtn.addEventListener('click', switchToHome);
    vaultNavBtn.addEventListener('click', switchToVault);
    ahkCard.addEventListener('click', downloadAHK);
    
    let notesVisible = false;
    notesCard.addEventListener('click', () => {
        if (notesVisible) {
            shortcutContainer.style.display = "none";
            notesVisible = false;
        } else {
            shortcutContainer.style.display = "block";
            notesVisible = true;
            renderShortcutNotes();
        }
    });
    
    saveItemButton.addEventListener('click', addNewItem);
    createFolderButton.addEventListener('click', createNewFolder);
    searchInputField.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderCards();
    });
    filterTypeSelect.addEventListener('change', (e) => {
        typeFilter = e.target.value;
        renderCards();
    });
    loginPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') attemptLogin();
    });
    
    closeViewModalButton.addEventListener('click', closeViewModal);
    viewModalOverlay.addEventListener('click', (e) => {
        if (e.target === viewModalOverlay) closeViewModal();
    });
    
    openEditFromViewButton.addEventListener('click', () => {
        if (viewingItemId) {
            closeViewModal();
            setTimeout(() => {
                openEditModal(viewingItemId);
            }, 200);
        }
    });
    
    cancelEditButton.addEventListener('click', closeEditModal);
    confirmEditButton.addEventListener('click', saveEditChanges);
    editModalOverlay.addEventListener('click', (e) => {
        if (e.target === editModalOverlay) closeEditModal();
    });

    // ============== CHECK SESSION ==============
    if (localStorage.getItem('nexus_auth') === 'true') {
        loginScreen.style.display = 'none';
        dashboardApp.style.display = 'block';
        loadFromLocalStorage();
        renderShortcutNotes();
        switchToHome();
    }
</script>
</body>
</html>
